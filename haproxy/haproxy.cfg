global
  daemon
  user haproxy
  group haproxy
  maxconn 4096
  log stdout format raw local0

defaults
  mode http
  timeout connect 5s
  timeout client  30s
  timeout server  30s
  log global
  option httplog

frontend http
  bind :80
  redirect scheme https 301
  
frontend https
  bind :443
  use_backend xray-reality if { hdr(host) -i {{ .settings.xray.reality.SNI }} }
  default_backend telegram

backend xray-reality
  server xray xray:443

backend telegram
  server telegram mtg:443
