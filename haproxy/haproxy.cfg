global
  daemon
  user haproxy
  group haproxy
  maxconn 4096
  log stdout format raw daemon

defaults
  timeout connect 5s
  timeout client  30s
  timeout server  30s
  log global
{{- if eq .log.level "debug" "info" }}
  option logasap
  log-format "%[accept_date(ms),ms_ltime('%Y/%m/%d %H:%M:%S.%3N')] | %ci:%cp > %f://%[capture.req.hdr(0)] > %b/%s"
{{- end }}

frontend http
  bind :80
  mode http
{{- if eq .log.level "debug" "info" }}
  capture request header Host len 32
{{- end }}
  use_backend caddy-http
  
frontend https
  bind :443
  mode tcp

  # Wait for a client hello for at most 5 seconds
  tcp-request inspect-delay 5s

{{- if eq .log.level "debug" "info" }}
  tcp-request content capture req.ssl_sni len 32
{{- end }}

  # Process the request only if it contains SSL Client Hello
  tcp-request content accept if { req.ssl_hello_type 1 }

  # Route to the appropriate backend based on the SNI
  use_backend xray-reality if { req.ssl_sni -i {{ join .local.xray.reality.domains " " }} }
  use_backend caddy if { req.ssl_sni -i {{ join .local.xray.xhttp.domains " " }} }
  use_backend telegram if { req.ssl_sni -i {{ .params.telegram.domain }} }

backend caddy
  mode tcp
  server caddy 172.22.0.10
  
backend caddy-http
  mode http
  server caddy 172.22.0.10

backend xray-reality
  mode tcp
  server xray 172.22.0.11:1443
  
backend xray-xhttp
  mode tcp
  server xray 172.22.0.11:2443

backend telegram
  mode tcp
  server mtg 172.22.0.12
