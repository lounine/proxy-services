global
  daemon
  user haproxy
  group haproxy
  maxconn 4096
  log stdout format raw daemon {{ if eq .log.level "debug" -}} debug {{- end }}

defaults
  timeout connect 5s
  timeout client  30s
  timeout server  30s
  log global

frontend http
  bind :80
  mode tcp
{{- if eq .log.level "debug" "info" }}
  option tcplog 
{{- end }}
  use_backend caddy 
  
frontend https
  bind :443
  mode tcp
{{- if eq .log.level "debug" "info" }}
  option tcplog
{{- end }}

  # Wait for a client hello for at most 5 seconds
  tcp-request inspect-delay 5s
  tcp-request content accept if { req.ssl_hello_type 1 }

  # Route to the appropriate backend based on the SNI
  use_backend xray-vision if { req.ssl_sni -i {{ join .local.xray.vision.domains " " }} }
  use_backend xray-xhttp if { req.ssl_sni -i {{ join .local.xray.xhttp.domains " " }} }
  use_backend telegram if { req.ssl_sni -i {{ .params.telegram.domain }} }

backend caddy
  server caddy 172.22.0.10

backend xray-vision
  server xray 172.22.0.11:1443
  
backend xray-xhttp
  server xray 172.22.0.11:2443

backend telegram
  server mtg 172.22.0.12:443
