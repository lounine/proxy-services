user nginx;
worker_processes auto;
worker_rlimit_nofile 4096;

pid /run/nginx.pid;
error_log /dev/stderr {{ if eq .log.level "warning" -}} warn
                      {{- else -}} {{.log.level }}
                      {{- end }};

events {
  worker_connections 4096;
}

http {
{{- if eq .log.level "debug" "info" }}
  log_format http_log '[$time_local] $remote_addr > $scheme://$host "$request" ($http_x_forwarded_for)';
  access_log /dev/stdout http_log;
{{- else }}
  access_log off;
{{- end }}

  http2 on;

  server {
    listen 80;
    listen [::]:80;

    # Pass acme challenges to acme.sh container
    location /.well-known/acme-challenge/ {
      proxy_pass http://acme;
    }

    location / {
      return 308 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /certs/$ssl_server_name.crt;
    ssl_certificate_key /certs/$ssl_server_name.key;
    ssl_certificate_cache max=1000 inactive=1h valid=1h;

    # If secret path is set, route traffic to xray's xhttp inbound
    location {{ .local.xray.xhttp.path }} {
      proxy_pass http://xray:2443;
      proxy_http_version 2;
      proxy_buffering off;
      proxy_read_timeout 5d;
    }

    location / {
      return 401 "Not Authorized";
    }
  }
}
