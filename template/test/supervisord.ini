[supervisord]
nodaemon=true
user=root
loglevel=info

[unix_http_server]
username = dummy
password = dummy


{{ define "tunnel" }}
[program:tun2socks_{{ . }}]
command=/usr/local/bin/tun2socks --device tun_{{ . }} --proxy socks5://xray:{{ . }}
user=nobody
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
{{- end -}}


