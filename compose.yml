name: proxy-services

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports: [ 80 ]
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - /usr/local/share/proxy_services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
  
  mtg:
    image: nineseconds/mtg:2
    container_name: mtg
    restart: unless-stopped
    ports:
      - ${MTG_PORT:-8443}:443
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - /usr/local/share/proxy_services/mtg/config.toml:/config/config.toml:ro

  xray:
    container_name: xray
    image: lounine/xray
    build:
      context: ./xray
    restart: unless-stopped
    ports:
      - ${XRAY_PORT:-443}:443
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - /usr/local/share/proxy_services/xray/config/:/usr/local/etc/xray/:ro
