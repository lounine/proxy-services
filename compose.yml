name: proxy-services

services:

  haproxy:
    image: haproxy:3.2
    container_name: haproxy
    restart: unless-stopped
    ports:
      - 80:80
      - ${EXTERNAL_PORT:-443}:443
    volumes:
      - /usr/local/share/proxy_services/config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      lan:
        ipv4_address: 172.22.0.2
        ipv6_address: fd00:0:0:1::2

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    volumes:
      - /usr/local/share/proxy_services/config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      lan:
        ipv4_address: 172.22.0.10
        ipv6_address: fd00:0:0:1::10

  xray:
    container_name: xray
    image: ghcr.io/xtls/xray-core
    restart: unless-stopped
    ports:
      - 127.0.0.1:1080:1080
      - 127.0.0.1:1081:1081
      - 127.0.0.1:1082:1082
    volumes:
      - /usr/local/share/proxy_services/config/xray/:/usr/local/etc/xray/:ro
      - /usr/local/share/proxy_services/certs/:/usr/local/share/certs/:ro
    networks:
      lan:
        ipv4_address: 172.22.0.11
        ipv6_address: fd00:0:0:1::11

  mtg:
    image: nineseconds/mtg:2
    container_name: mtg
    restart: unless-stopped
    volumes:
      - /usr/local/share/proxy_services/config/mtg/config.toml:/config/config.toml:ro
    networks:
      lan:
        ipv4_address: 172.22.0.12
        ipv6_address: fd00:0:0:1::12

networks:
  lan:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.22.0.0/16
        - subnet: "fd00:0:0:1::/64"
