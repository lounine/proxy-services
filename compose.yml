name: proxy-services

services:

  nginx:
    image: nginx:1.31
    container_name: nginx
    restart: unless-stopped
    ports:
      - 80:80
      - ${EXTERNAL_PORT:-443}:443
    volumes:
      - /usr/local/share/proxy_services/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /usr/local/share/proxy_services/certs:/etc/nginx/certs:ro
    networks:
      lan:
        ipv4_address: 172.22.0.2
        ipv6_address: fd00:0:0:1::2
        
  acme.sh:
    image: neilpang/acme.sh:3.1.3
    container_name: acme.sh
    restart: unless-stopped
    command: daemon
    volumes:
      - /usr/local/share/proxy_services/certs:/certs:rw
    networks:
      lan:
        ipv4_address: 172.22.0.3
        ipv6_address: fd00:0:0:1::3

  xray:
    container_name: xray
    image: ghcr.io/xtls/xray-core
    restart: unless-stopped
    ports:
      - 127.0.0.1:1080:1080
      - 127.0.0.1:1081:1081
      - 127.0.0.1:1082:1082
      - 127.0.0.1:1083:1083
      - 127.0.0.1:1084:1084
      - 127.0.0.1:1085:1085
    volumes:
      - /usr/local/share/proxy_services/config/xray/:/usr/local/etc/xray/:ro
      - /usr/local/share/proxy_services/certs/:/usr/local/share/certs/:ro
    networks:
      lan:
        ipv4_address: 172.22.0.11
        ipv6_address: fd00:0:0:1::11

  mtg:
    image: nineseconds/mtg:2
    container_name: mtg
    restart: unless-stopped
    volumes:
      - /usr/local/share/proxy_services/config/mtg/config.toml:/config/config.toml:ro
    networks:
      lan:
        ipv4_address: 172.22.0.12
        ipv6_address: fd00:0:0:1::12

networks:
  lan:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.22.0.0/16
        - subnet: "fd00:0:0:1::/64"
