name: proxy-services

# Providing static hosts in order to resolve IPs even when some containers are not yet up:
x-hosts: &extra_hosts
  - "nginx:172.22.0.2"
  - "acme:172.22.0.3"
  - "xray:172.22.0.11"
  - "mtg:172.22.0.12"
  - "test:172.22.0.21"
  - "test-remote:172.23.0.21"
  - "test-first-hop:172.24.0.21"

services:

  nginx:
    image: nginx:1.31
    container_name: nginx
    restart: unless-stopped
    ports:
      - 80:80
      - ${EXTERNAL_PORT:-443}:443
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    extra_hosts: *extra_hosts
    networks:
      lan:
        ipv4_address: 172.22.0.2
        ipv6_address: fd00:0:0:1::2
        
  acme:
    image: neilpang/acme.sh:3.1.3
    container_name: acme
    restart: unless-stopped
    command: daemon
    volumes:
      - ./certs:/certs:rw
      - ./acme:/acme.sh:rw
    networks:
      lan:
        ipv4_address: 172.22.0.3
        ipv6_address: fd00:0:0:1::3

  xray:
    container_name: xray
    image: ghcr.io/xtls/xray-core
    restart: unless-stopped
    ports:
      - 8443:3443
    volumes:
      - ./config/xray/:/usr/local/etc/xray/:ro
      - ./certs/:/usr/local/share/certs/:ro
    extra_hosts: *extra_hosts
    networks:
      lan:
        ipv4_address: 172.22.0.11
        ipv6_address: fd00:0:0:1::11

  mtg:
    image: nineseconds/mtg
    container_name: mtg
    restart: unless-stopped
    volumes:
      - ./config/mtg/config.toml:/config/config.toml:ro
    extra_hosts: *extra_hosts
    networks:
      lan:
        ipv4_address: 172.22.0.12
        ipv6_address: fd00:0:0:1::12

  test:
    container_name: test
    build:
      context: ./test
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - ./config/test/supervisord.ini:/etc/supervisor.d/supervisord.ini:ro
      - ./test/bin:/usr/local/bin/test:ro
    extra_hosts: *extra_hosts
    networks:
      lan:
        ipv4_address: 172.22.0.21
        ipv6_address: fd00:0:0:1::21


networks:
  lan:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.22.0.0/16
        - subnet: "fd00:0:0:1::/64"
