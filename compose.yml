name: proxy-services

# Providing static hosts in order to resolve IPs even when some containers are not yet up
# Moreover, haproxy resolves hostnames in configs on start-up only
x-hosts: &extra_hosts
  - "haproxy:172.22.0.2"
  - "nginx:172.22.0.3"
  - "caddy:172.22.0.10"
  - "acme:172.22.0.11"
  - "xray:172.22.0.12"
  - "mtg:172.22.0.13"
  - "test:172.22.0.22"
  - "test-server:172.22.0.21"
  - "test-remote:172.23.0.21"
  - "test-first-hop:172.24.0.21"


services:

  haproxy:
    image: haproxy:3.4
    container_name: haproxy
    restart: unless-stopped
    ports:
      - 80:80
      - ${EXTERNAL_PORT:-443}:443
    volumes:
      - ./config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./certs:/certs:ro
    extra_hosts: *extra_hosts
    networks:
      lan:
        ipv4_address: 172.22.0.2
        ipv6_address: fd00:0:0:1::2

  nginx:
    image: nginx:1.31
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro
    extra_hosts: *extra_hosts
    networks:
      lan:
        ipv4_address: 172.22.0.3
        ipv6_address: fd00:0:0:1::3

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts: *extra_hosts
    networks:
      lan:
        ipv4_address: 172.22.0.10
        ipv6_address: fd00:0:0:1::10

  acme:
    image: neilpang/acme.sh:3.1.3
    container_name: acme
    restart: unless-stopped
    command: daemon
    volumes:
      - ./acme:/acme.sh:rw
      - ./certs:/certs:rw
    networks:
      lan:
        ipv4_address: 172.22.0.11
        ipv6_address: fd00:0:0:1::11

  xray:
    container_name: xray
    image: ghcr.io/xtls/xray-core
    restart: unless-stopped
    volumes:
      - ./config/xray/:/usr/local/etc/xray/:ro
      - ./certs/:/certs/:ro
    extra_hosts: *extra_hosts
    networks:
      lan:
        ipv4_address: 172.22.0.12
        ipv6_address: fd00:0:0:1::12

  mtg:
    image: nineseconds/mtg
    container_name: mtg
    restart: unless-stopped
    volumes:
      - ./config/mtg/config.toml:/config/config.toml:ro
    extra_hosts: *extra_hosts
    networks:
      lan:
        ipv4_address: 172.22.0.13
        ipv6_address: fd00:0:0:1::13

  test-server:
    container_name: test-server
    build:
      context: ./test-server
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    volumes:
      - ./config/test-server/supervisord.ini:/etc/supervisor.d/supervisord.ini:ro
    networks:
      lan:
        ipv4_address: 172.22.0.21
        ipv6_address: fd00:0:0:1::21
        
  test:
    container_name: test
    build:
      context: ./test
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - ./config/test/supervisord.ini:/etc/supervisor.d/supervisord.ini:ro
      - ./test/bin:/usr/local/bin/test:ro
    extra_hosts: *extra_hosts
    networks:
      lan:
        ipv4_address: 172.22.0.22
        ipv6_address: fd00:0:0:1::22


networks:
  lan:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.22.0.0/16
        - subnet: "fd00:0:0:1::/64"
