name: proxy-services

services:

  haproxy:
    image: haproxy:3.2
    container_name: haproxy
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - /usr/local/share/proxy_services/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on: # Haproxy resolves backend IPs on start – they must be up by then
      - xray
      - mtg

  xray:
    container_name: xray
    image: lounine/xray
    build:
      context: ./xray
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - /usr/local/share/proxy_services/xray/config/:/usr/local/etc/xray/:ro
      
  mtg:
    image: nineseconds/mtg:2
    container_name: mtg
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - /usr/local/share/proxy_services/mtg/config.toml:/config/config.toml:ro
