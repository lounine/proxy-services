name: proxy-services

# Providing static hosts in order to resolve IPs even when some containers are not yet up
# Moreover, haproxy resolves hostnames in configs on start-up only
x-hosts: &extra_hosts
  - "haproxy:172.22.0.2"
  - "acme:172.22.0.11"
  - "xray:172.22.0.12"
  - "mtg:172.22.0.13"
  - "test:172.22.0.22"
  - "test-server:172.22.0.21"
  - "test-remote:172.23.0.21"
  - "test-first-hop:172.24.0.21"

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "100m"


services:

  haproxy:
    image: haproxy:3.4
    container_name: haproxy
    restart: unless-stopped
    ports:
      - 80:80
      - ${EXTERNAL_PORT:-443}:443
    volumes:
      - ./config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - acme_certs:/certs:ro
      - haproxy_admin:/var/lib/haproxy:rw
    extra_hosts: *extra_hosts
    logging: *logging
    networks:
      lan:
        ipv4_address: 172.22.0.2
        ipv6_address: fd00:0:0:1::2

  acme:
    image: neilpang/acme.sh:3.1.3
    container_name: acme
    restart: unless-stopped
    command: daemon
    volumes:
      - acme_account:/acme.sh:rw
      - acme_certs:/certs:rw
      - haproxy_admin:/var/lib/haproxy:rw
    environment:
      DEPLOY_HAPROXY_HOT_UPDATE: yes 
      DEPLOY_HAPROXY_STATS_SOCKET: UNIX:/var/lib/haproxy/admin.sock 
      DEPLOY_HAPROXY_PEM_PATH: /certs
    depends_on: 
      - haproxy   # important in order to create haproxy_admin volume with proper ownership 
    logging: *logging
    networks:
      lan:
        ipv4_address: 172.22.0.11
        ipv6_address: fd00:0:0:1::11

  xray:
    container_name: xray
    image: ghcr.io/xtls/xray-core
    restart: unless-stopped
    volumes:
      - ./config/xray/:/usr/local/etc/xray/:ro
    extra_hosts: *extra_hosts
    logging: *logging
    networks:
      lan:
        ipv4_address: 172.22.0.12
        ipv6_address: fd00:0:0:1::12

  mtg:
    image: nineseconds/mtg
    container_name: mtg
    restart: unless-stopped
    volumes:
      - ./config/mtg/config.toml:/config/config.toml:ro
    extra_hosts: *extra_hosts
    logging: *logging
    networks:
      lan:
        ipv4_address: 172.22.0.13
        ipv6_address: fd00:0:0:1::13

  test-server:
    container_name: test-server
    build:
      context: ./test-server
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    volumes:
      - ./config/test-server/supervisord.ini:/etc/supervisor.d/supervisord.ini:ro
    logging: *logging
    networks:
      lan:
        ipv4_address: 172.22.0.21
        ipv6_address: fd00:0:0:1::21
   
  test:
    container_name: test
    build:
      context: ./test
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - ./config/test/supervisord.ini:/etc/supervisor.d/supervisord.ini:ro
      - ./test/bin:/usr/local/bin/test:ro
    extra_hosts: *extra_hosts
    logging: *logging
    networks:
      lan:
        ipv4_address: 172.22.0.22
        ipv6_address: fd00:0:0:1::22


networks:
  lan:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.22.0.0/16
        - subnet: "fd00:0:0:1::/64"


volumes:
  acme_account:
  acme_certs:
  haproxy_admin:
