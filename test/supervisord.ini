[supervisord]
nodaemon=true
user=root
loglevel=info

[unix_http_server]
username = dummy
password = dummy

[program:iperf3_server]
command=/usr/bin/iperf3 --server
user=nobody
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:tun2socks_1080]
command=/usr/local/bin/tun2socks --device tun_1080 --proxy socks5://xray:1080
user=nobody
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:tun2socks_1081]
command=/usr/local/bin/tun2socks --device tun_1081 --proxy socks5://xray:1081
user=nobody
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0


[program:tun2socks_1082]
command=/usr/local/bin/tun2socks --device tun_1082 --proxy socks5://xray:1082
user=nobody
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0


[program:tun2socks_1083]
