[supervisord]
nodaemon=true
logfile=/dev/fd/1

[program:iperf3_server]
command=/usr/bin/iperf3 --server
logfile=/dev/fd/1

[program:tun2socks_80]
command=/usr/local/bin/tun2socks --device tun80 --proxy socks5://172.22.0.11:1080
logfile=/dev/fd/1

[program:tun2socks_81]
command=/usr/local/bin/tun2socks --device tun81 --proxy socks5://172.22.0.11:1081
logfile=/dev/fd/1

[program:tun2socks_82]
command=/usr/local/bin/tun2socks --device tun82 --proxy socks5://172.22.0.11:1082
logfile=/dev/fd/1

[program:tun2socks_83]
command=/usr/local/bin/tun2socks --device tun83 --proxy socks5://172.22.0.11:1083
logfile=/dev/fd/1
